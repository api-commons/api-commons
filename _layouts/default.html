<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - {{ site.description }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:type" content="website">

    <link href="/assets/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/sticky-footer.css" rel="stylesheet">
    <script src="/assets/bootstrap.bundle.min.js"></script>
    <script src="/assets/js-yaml.min.js"></script>

    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #333; }
      .navbar { padding: 0.75rem 0; }
      .navbar-brand { font-weight: 700; font-size: 1.4rem; letter-spacing: -0.5px; }
      .nav-link { font-size: 0.95rem; padding: 0.5rem 1rem !important; }
      .container.my-5 { max-width: 960px; }
      .footer { background-color: #f8f9fa; border-top: 1px solid #e9ecef; }
      .footer a { color: #555; text-decoration: none; font-size: 0.9rem; }
      .footer a:hover { color: #000; text-decoration: underline; }
      a { color: #0d6efd; }
      a:hover { color: #0a58ca; }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WNSPT4B4S8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WNSPT4B4S8');
    </script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ site.url }}/">API Commons</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ site.url }}/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://apisjson.org" target="_blank" rel="noopener">APIs.json</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if page.url contains '/common/' %} active{% endif %}" href="{{ site.url }}/common/">Common</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if page.url contains '/community/' %} active{% endif %}" href="{{ site.url }}/community/">Community</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if page.url contains '/rules/' %} active{% endif %}" href="{{ site.url }}/rules/">Rules</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if page.url contains '/rulesets/' %} active{% endif %}" href="{{ site.url }}/rulesets/">Rulesets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if page.url contains '/blog/' %} active{% endif %}" href="{{ site.url }}/blog/">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if page.url contains '/about/' %} active{% endif %}" href="{{ site.url }}/about/">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container my-5" role="main">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="container">
        <div class="d-flex justify-content-center gap-4 align-items-center" style="height: 60px;">
          <a href="https://apis.io">APIs.io</a>
          <a href="https://apisjson.org">APIs.json</a>
          <a href="https://github.com/api-commons/api-commons/issues">GitHub Issues</a>
          <a href="https://github.com/orgs/api-commons/discussions">GitHub Discussions</a>
          <a href="https://github.com/api-commons/api-commons">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
