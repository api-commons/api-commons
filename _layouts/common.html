---
layout: default
---
<div class="d-flex justify-content-between align-items-start mb-3">
  <h2 class="mb-0 me-3">{{ page.title }}</h2>
  {% include ai-toolbar.html %}
</div>
<img src="{{ page.image }}" class="float-end ms-3 mb-3" width="250">
<p>{{ page.description }}</p>
<h3>Links</h3>
<ul>
    <li><a href="{{ page.url }}">Repo</a></li>
</ul>
<h3>Tags</h3>
<ul>
{% for tag in page.tags %}
    <li>{{ tag }}</li>
{% endfor %}
</ul>
<h3>Examples</h3>
<script src="{{ page.gist }}"></script>
<br>
<p class="text-center"><a href="/common/"><strong>All Common Properties</strong></a></p>
