name: API Commons
description: The website for the API Commons of open source machine readable API operation properties.
url: http://apicommons.org
image: /images/api-commons-icon.png
logo: /images/api-commons-logo.png

version:      1.1.1
author:
  name:       'Kin Lane'
  email:      'info@apievangelist.com'

permalink: /:categories/:year/:month/:day/:title/
paginate:           25

paginate_path:      "/blog/:num/"

# Build settings
markdown:           kramdown
highlighter:        rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-avatar
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules

sass:
  style:            compressed

github_repo: api-commons
github_branch: main

collections:
  common:
    output: true
    permalink: /common/:path/    
  community:
    output: true
    permalink: /community/:path/  
  overlays:
    output: true
    permalink: /overlays/:path/  
  base:
    output: true
    permalink: /base/:path/ 
  blueprints:
    output: true
    permalink: /base/:path/ 

defaults:

  - scope:
      path:         ""
      type:         common
    values:
      layout:       common
  - scope:
      path:         ""
      type:         community
    values:
      layout:       community
  - scope:
      path:         ""
      type:         overlays
    values:
      layout:       overlays            
  - scope:
      path:         ""
      type:         base
    values:
      layout:       base        
  - scope:
      path:         ""
      type:         blueprints
    values:
      layout:       blueprints       