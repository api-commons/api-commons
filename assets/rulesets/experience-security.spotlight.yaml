              subject:
                const: required
            required:
            - subject
          then:
            required:
            - token
            properties:
              token:
                type: object
                required:
                - exchange
                properties:
                  exchange:
                    const: true
    tags:
    - format:openapi
    - spec:operations
    - topic:agentic-access
