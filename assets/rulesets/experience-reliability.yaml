      function: truthy
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-require-window
  rate-limits-limit-window-format:
    description: A limit window should be a duration like 60s, 1m, 1h, or 1d.
    message: Limit window should be a duration (e.g. 60s, 1h).
    given: $.limits[*].window
    severity: info
    then:
      function: pattern
      functionOptions:
        match: ^\d+(ms|s|m|h|d)$
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-window-format
  agent-skill-skill-body-length:
    description: Skill bodies should stay focused — very long instructions degrade agent performance. Keep the body under
      ~5000 words.
    message: Skill body is very long (over ~5000 words).
    severity: info
    given: $.words
    then:
      function: schema
      functionOptions:
        schema:
          type: integer
          maximum: 5000
    documentationUrl: https://apicommons.org/rules/#agent-skill-skill-body-length
  agent-skill-skill-body-present:
    description: A skill must have body content, not just frontmatter — the body is the instruction set the agent actually
      follows.
    message: A skill must have body content.
    severity: info
    given: $.words
    then:
      function: schema
      functionOptions:
        schema:
          type: integer
          minimum: 1
    documentationUrl: https://apicommons.org/rules/#agent-skill-skill-body-present
