          minimum: 1
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-max-positive
  rate-limits-limit-require-max:
    description: The `max` property of each limit should be present.
    message: max should be present
    severity: info
    given: $.limits[*]
    then:
      field: max
      function: truthy
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-require-max
  rate-limits-limit-require-name:
    description: The `name` property of each limit should be present.
    message: name should be present
    severity: info
    given: $.limits[*]
    then:
      field: name
      function: truthy
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-require-name
  rate-limits-limit-require-scope:
    description: The `scope` property of each limit should be present.
    message: scope should be present
    severity: info
    given: $.limits[*]
    then:
      field: scope
      function: truthy
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-require-scope
  rate-limits-limit-require-window:
    description: The `window` property of each limit should be present.
    message: window should be present
    severity: info
    given: $.limits[*]
    then:
