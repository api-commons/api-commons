    message: Has a Stage Environment
    severity: info
    given:
    - $.apis.*.properties.*
    - $.common.*
    then:
    - field: type
      function: pattern
      functionOptions:
        notMatch: \b(StagingEnvironment)\b
    documentationUrl: https://apicommons.org/rules/#apis-json-schema-include-staging-environment
  asyncapi-component-asyncapi-message-require-correlation-id:
