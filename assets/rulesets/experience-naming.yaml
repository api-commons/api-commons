    severity: info
    given:
    - $.tags[*].name
    - $.paths[*][*].tags[*]
    then:
      function: pattern
      functionOptions:
        notMatch: /^[a-z]+[A-Z][a-z]+$/g
    documentationUrl: https://apicommons.org/rules/#openapi-tag-no-camel-case
  openapi-tag-no-pascal-case:
    description: Tag names cannot use Pascal Case. Please rename {{value}}.
