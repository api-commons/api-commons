    message: '{{error}}'
    severity: info
    given: $.servers
    then:
      function: trimble-valid-version-checker
    documentationUrl: https://apicommons.org/rules/#openapi-server-url-include-version
  openapi-server-url-include-version-oas2:
    formats:
    - oas2
    description: The API base path should include a version segment (e.g. /v1) so consumers can pin to a major version.
    message: Base path should include a version (e.g. /v1).
    severity: info
    given: $.basePath
    then:
      function: pattern
      functionOptions:
        match: /v\d+
    documentationUrl: https://apicommons.org/rules/#openapi-server-url-include-version-oas2
  openapi-server-url-meet-standards:
    formats:
    - oas3
    description: API URLs should meet the Trimble API Standards.
    message: '{{error}}'
    severity: info
    given: $.servers
    then:
      function: trimble-valid-url-checker
    documentationUrl: https://apicommons.org/rules/#openapi-server-url-meet-standards
  openapi-server-url-must-be-lowercase:
    description: Server URL SHOULD BE lowercase.
    message: Server URL SHOULD BE lowercase.
    severity: info
    given: $.servers..url
    then:
      function: pattern
      functionOptions:
        match: ^[^A-Z]*$
    formats:
    - oas3
