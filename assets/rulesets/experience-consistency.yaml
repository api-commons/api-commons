    severity: info
    then:
      field: interval
      function: truthy
    documentationUrl: https://apicommons.org/rules/#plans-plan-require-interval
  rate-limits-limit-scope-known:
    description: A limit scope should be one of ip, user, api-key, client, or global.
    message: Limit scope should be a known value.
    given: $.limits[*].scope
    severity: info
    then:
      function: schema
      functionOptions:
        schema:
          type: string
          enum:
          - ip
          - user
          - api-key
          - client
          - global
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-scope-known
  rate-limits-limit-window-format:
    description: A limit window should be a duration like 60s, 1m, 1h, or 1d.
    message: Limit window should be a duration (e.g. 60s, 1h).
    given: $.limits[*].window
    severity: info
    then:
      function: pattern
      functionOptions:
        match: ^\d+(ms|s|m|h|d)$
    documentationUrl: https://apicommons.org/rules/#rate-limits-limit-window-format
  finops-document-finops-currency-iso4217:
    description: currency should be a 3-letter ISO 4217 code (e.g. USD).
    message: currency should be an ISO 4217 code.
    given: $.currency
    severity: info
    then:
      function: pattern
      functionOptions:
        match: ^[A-Z]{3}$
    documentationUrl: https://apicommons.org/rules/#finops-document-finops-currency-iso4217
  finops-document-finops-require-period:
    description: A FinOps artifact should declare a period (e.g. monthly, annual) for the budget and costs.
    message: FinOps should declare a period.
    given: $
    severity: info
    then:
      field: period
      function: truthy
    documentationUrl: https://apicommons.org/rules/#finops-document-finops-require-period
  agent-skill-skill-description-single-line:
    description: A skill description should be a single line (no embedded line breaks) so it renders cleanly in pickers.
    message: Skill description should be a single line.
    given: $.frontmatter.description
    severity: info
    then:
      function: pattern
      functionOptions:
        notMatch: \n
    documentationUrl: https://apicommons.org/rules/#agent-skill-skill-description-single-line
