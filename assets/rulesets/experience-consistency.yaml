  openapi-request-delete-must-not-have-body-oas2:
    formats:
    - oas2
    description: A DELETE operation must not accept a body parameter.
    message: DELETE operations must not accept a body parameter.
    severity: info
    given: $.paths[*].delete.parameters[?(@.in=='body')]
    then:
      function: undefined
    documentationUrl: https://apicommons.org/rules/#openapi-request-delete-must-not-have-body-oas2
  openapi-request-delete-no-body:
    description: DELETE requests MUST NOT have a request body.
    message: DELETE requests MUST NOT have a request body.
    severity: info
    given: $.paths[*].delete.requestBody
    then:
      function: falsy
