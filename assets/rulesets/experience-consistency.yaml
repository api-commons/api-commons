    documentationUrl: https://apicommons.org/rules/#openapi-request-head-must-not-have-body-oas2
  openapi-request-header-names-pascal-case:
    description: Headers should be pascal-case. See Italian recommendation RAC_REST_NAME_003.
    message: '{{value}} {{error}} in {{path}}'
    severity: info
    given:
    - $.[parameters][?(@.in=="header")].name
    then:
      function: casing
      functionOptions:
        type: pascal
        separator:
          char: '-'
