    documentationUrl: https://apicommons.org/rules/#openapi-request-get-must-not-have-body
  openapi-request-get-must-not-have-body-oas2:
    formats:
    - oas2
    description: A `GET` request MUST NOT accept a body parameter.
    message: A `GET` request MUST NOT accept a body parameter.
    severity: info
    given: $.paths[*][get].parameters[?(@.in=='body')]
    then:
      function: undefined
    documentationUrl: https://apicommons.org/rules/#openapi-request-get-must-not-have-body-oas2
  openapi-request-get-no-body:
    description: GET requests MUST NOT have a request body.
    message: GET requests MUST NOT have a request body.
    severity: info
    given: $.paths[*].get.requestBody
    then:
      function: falsy
      message: '{{description}}: {{error}}'
    formats:
    - oas3
    documentationUrl: https://apicommons.org/rules/#openapi-request-get-no-body
  openapi-request-head-must-not-have-body:
    formats:
    - oas3
    description: A `HEAD` request MUST NOT accept a request body.
    message: A `HEAD` request MUST NOT accept a request body.
    severity: info
    given: $.paths[*][head].requestBody
    then:
      function: undefined
    documentationUrl: https://apicommons.org/rules/#openapi-request-head-must-not-have-body
  openapi-request-head-must-not-have-body-oas2:
    formats:
    - oas2
    description: A `HEAD` request MUST NOT accept a body parameter.
    message: A `HEAD` request MUST NOT accept a body parameter.
    severity: info
    given: $.paths[*][head].parameters[?(@.in=='body')]
    then:
